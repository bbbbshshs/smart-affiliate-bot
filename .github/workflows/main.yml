name: Bot de Ofertas Afiliado

on:
  schedule:
    # Executa a cada 6 horas (meia-noite, 6h, 12h, 18h UTC).
    # O horário é em UTC (3 horas a mais que o horário de Brasília).
    - cron: '0 */6 * * *'
  # Permite que você execute o bot manualmente para testes.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar o bot
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python rastreador_ofertas.py
